function options(id,key,label){const prev=$(id).value;$(id).innerHTML='<option value="">'+label+'：すべて</option>';let vals=[...new Set(data.map(x=>x[key]))].filter(Boolean);if(key==='pref')vals=vals.sort((a,b)=>(PREF_ORDER.indexOf(a)+1||99)-(PREF_ORDER.indexOf(b)+1||99)||a.localeCompare(b,'ja'));else vals=vals.sort((a,b)=>a.localeCompare(b,'ja'));vals.forEach(v=>$(id).add(new Option(v,v)));$(id).value=prev||''}

function matches(x){const words=norm($('query').value).toLowerCase().split(' ').filter(Boolean);const hay=norm([x.name,x.brewery,x.pref,x.contest,x.category,x.award].join(' ')).toLowerCase();return words.every(w=>hay.includes(w))&&['pref','contest','spec','award'].every(k=>!$(k).value||x[k]===$(k).value)}
